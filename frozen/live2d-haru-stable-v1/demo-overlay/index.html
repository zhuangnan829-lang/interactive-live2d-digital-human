<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2D AI 课程讲师 · 隔离验证</title>
  <link rel="stylesheet" href="./src/audit.css">
  <script src="./Core/live2dcubismcore.js"></script>
  <script src="./src/main.ts" type="module"></script>
</head>
<body>
  <main class="shell">
    <section class="stage-card">
      <div class="stage-copy">
        <span class="eyebrow">LIVE2D WEB SDK · ISOLATED AUDIT</span>
        <h1>AI 课程讲解数字人</h1>
        <p>Haru Reception 官方样例 · 真实参数驱动</p>
      </div>
      <div class="status-pill" id="status-pill">LOADING</div>
      <div class="telemetry"><b id="fps">0 FPS</b><span id="sample">等待 60 秒性能样本</span></div>
    </section>
    <aside class="panel">
      <header>
        <span>COURSE PRESENTER</span>
        <h2>让课程讲解更自然</h2>
        <p id="status">正在加载 Live2D 模型与 WebGL2 渲染器…</p>
      </header>
      <label>中文讲解内容
        <textarea id="text" maxlength="500">欢迎来到人工智能课程。今天我们将介绍实时数字讲师如何根据中文语音自然表达。</textarea>
      </label>
      <div class="field-label">表达状态</div>
      <div class="emotions" id="emotions">
        <button class="selected" data-emotion="natural">自然</button>
        <button data-emotion="smile">微笑</button>
        <button data-emotion="serious">认真</button>
        <button data-emotion="doubt">疑惑</button>
      </div>
      <label class="strength-row">表达强度 <output id="strength-value">62%</output>
        <input id="strength" type="range" min="0" max="1" step="0.01" value="0.62">
      </label>
      <div class="actions">
        <button id="speak" class="primary" disabled>开始播报</button>
        <button id="stop" disabled>立即停止</button>
        <button id="retry">重试加载</button>
      </div>
      <div class="facts">
        <span>WebGL2</span><span>ParamMouthOpenY</span><span>AnalyserNode</span><span id="mouth-meter">Mouth 0.00</span>
      </div>
      <small>本页仅用于隔离技术验证。样例角色版权归 Live2D Inc. 所有，并按官方条款使用。</small>
    </aside>
  </main>
</body>
</html>
